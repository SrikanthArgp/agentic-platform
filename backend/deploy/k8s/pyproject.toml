# Tests over the rendered Kubernetes manifests (docs/plan.md Day 18). Not a
# service: no app code, just pytest over `kubectl kustomize` output.
[project]
name = "ap-k8s-manifests"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
