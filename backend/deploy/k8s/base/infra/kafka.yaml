# Kafka (KRaft, combined broker+controller), single replica, dev-grade.
# Listeners: PLAINTEXT kafka:9092 for pods; HOST localhost:39092 for host
# tools through `kubectl port-forward` (39092, so it never clashes with
# Compose's 29092). Topics come from the kafka-topics Job; auto-create is off.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # Headless: "kafka" resolves to the broker pod itself.
  clusterIP: None
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: plaintext, port: 9092, targetPort: 9092 }
    - { name: host, port: 39092, targetPort: 39092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/component: infra }
    spec:
      # The image turns every KAFKA_* variable into broker config; Kubernetes
      # service links (KAFKA_PORT=tcp://...) would break it.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:39092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092,HOST://localhost:39092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m" }
          ports:
            - { name: plaintext, containerPort: 9092 }
            - { name: host, containerPort: 39092 }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
          # TCP checks: an exec of kafka-broker-api-versions.sh starts a JVM
          # every period. The topics Job retries until the broker answers.
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
