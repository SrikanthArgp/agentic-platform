# registry: REST App Manifests and tool registrations (Postgres).
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector: { app.kubernetes.io/name: registry }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry, app.kubernetes.io/component: service }
    spec:
      enableServiceLinks: false
      containers:
        - name: registry
          image: agentic-platform/registry
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: platform-config }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "500m", memory: 512Mi }
          # Liveness is /healthz (the process is up); readiness is /readyz,
          # the same check here: one replica, not rolled per app (Day 19's
          # dependency-aware readiness is for ingestion/orchestrator/
          # tool-gateway). The startup probe holds both off while uv starts the app.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
