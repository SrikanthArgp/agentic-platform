# ingestion: REST event intake; writes the outbox (Postgres), rate limits (Redis).
apiVersion: v1
kind: Service
metadata:
  name: ingestion
spec:
  selector: { app.kubernetes.io/name: ingestion }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  # Day 19 (ADR-0014): a rolling update never drops below 2 serving pods.
  # The new pod must pass /readyz before an old one is stopped.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: ingestion }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ingestion, app.kubernetes.io/component: service }
    spec:
      enableServiceLinks: false
      # preStop (5s) + draining: each request is at most one outbox write (WRITE_TIMEOUT_S, 5s).
      terminationGracePeriodSeconds: 30
      # One replica per node where possible, so a node going away leaves one
      # serving. matchLabelKeys: count only this ReplicaSet's pods; otherwise
      # a rollout places new pods away from the old ones it's replacing, and
      # ends with every new pod on one node (seen on Day 19).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ingestion }
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: ingestion
          image: agentic-platform/ingestion
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: platform-config }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "500m", memory: 512Mi }
          # Stopping: the pod leaves the Service's endpoints while this
          # sleeps, so no new connection reaches it after SIGTERM; then the
          # app fails /readyz and drains (backend/shared/lifecycle).
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # Liveness is /healthz (the process is up); readiness is /readyz
          # (startup finished, not draining, and what this pod needs is
          # reachable). The startup probe holds both off while uv starts the app.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
# Voluntary disruptions (kubectl drain, node upgrades) keep one pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestion
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ingestion }
