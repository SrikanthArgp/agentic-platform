# orchestrator: Runs every app's agents: consumes alert.received, publishes alert.decided;
# gRPC RunAgent on 50051. The only pod with the LLM key (llm-api-key Secret).
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector: { app.kubernetes.io/name: orchestrator }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator, app.kubernetes.io/component: service }
    spec:
      enableServiceLinks: false
      containers:
        - name: orchestrator
          image: agentic-platform/orchestrator
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 50051 }
          envFrom:
            - configMapRef: { name: platform-config }
            # OPENAI_API_KEY (and anything else in backend/local/.env), as Compose's env_file.
            - secretRef: { name: llm-api-key }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          # Liveness is /healthz (the process is up); readiness is /readyz
          # (Day 19 makes it check this pod's dependencies). The startup probe
          # holds both off while uv starts the app.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
