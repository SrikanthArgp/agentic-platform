# orchestrator: Runs every app's agents: consumes alert.received, publishes alert.decided;
# gRPC RunAgent on 50051. The only pod with the LLM key (llm-api-key Secret).
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector: { app.kubernetes.io/name: orchestrator }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  # Day 19 (ADR-0014): a rolling update never drops below 2 serving pods.
  # The new pod must pass /readyz before an old one is stopped.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator, app.kubernetes.io/component: service }
    spec:
      enableServiceLinks: false
      # preStop (5s) + draining: the current alert may run up to RUN_TIMEOUT_S (120s), then publish and commit.
      terminationGracePeriodSeconds: 150
      # One replica per node where possible, so a node going away leaves one
      # serving. matchLabelKeys: count only this ReplicaSet's pods; otherwise
      # a rollout places new pods away from the old ones it's replacing, and
      # ends with every new pod on one node (seen on Day 19).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: orchestrator }
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: orchestrator
          image: agentic-platform/orchestrator
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 50051 }
          envFrom:
            - configMapRef: { name: platform-config }
            # OPENAI_API_KEY (and anything else in backend/local/.env), as Compose's env_file.
            - secretRef: { name: llm-api-key }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          # Stopping: the pod leaves the Service's endpoints while this
          # sleeps, so no new connection reaches it after SIGTERM; then the
          # app fails /readyz and drains (backend/shared/lifecycle).
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # Liveness is /healthz (the process is up); readiness is /readyz
          # (startup finished, not draining, and what this pod needs is
          # reachable). The startup probe holds both off while uv starts the app.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
# Voluntary disruptions (kubectl drain, node upgrades) keep one pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orchestrator
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator }
