# outbox-relay: Worker, not a service (ADR-0030): drains outbox + verdict_outbox to Kafka.
# replicas: 1. A second pod during a rollout waits on the Postgres advisory
# lock as `standby`, which /readyz counts as ready (it has a Postgres
# session); readiness can't require the lock, or a one-replica rolling
# update would never finish (the new pod waits for the old one's lock).
apiVersion: v1
kind: Service
metadata:
  name: outbox-relay
spec:
  selector: { app.kubernetes.io/name: outbox-relay }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: outbox-relay }
  template:
    metadata:
      labels: { app.kubernetes.io/name: outbox-relay, app.kubernetes.io/component: worker }
    spec:
      enableServiceLinks: false
      containers:
        - name: outbox-relay
          image: agentic-platform/outbox-relay
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: platform-config }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "500m", memory: 256Mi }
          # Liveness is /healthz (the process is up); readiness is /readyz
          # (Postgres reachable; `standby` counts as ready, Day 18). The
          # startup probe holds both off while uv starts the app.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
