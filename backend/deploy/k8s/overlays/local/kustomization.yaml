# Local kind overlay. The tag below is a placeholder that never exists:
# render.sh overrides it with the git SHA that k8s_up.sh built and loaded,
# so every rollout is a real tag change (never `latest`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingestion-nodeport.yaml
images:
  - { name: agentic-platform/ingestion, newTag: unbuilt }
  - { name: agentic-platform/orchestrator, newTag: unbuilt }
  - { name: agentic-platform/tool-gateway, newTag: unbuilt }
  - { name: agentic-platform/memory-store, newTag: unbuilt }
  - { name: agentic-platform/registry, newTag: unbuilt }
  - { name: agentic-platform/review-console, newTag: unbuilt }
  - { name: agentic-platform/outbox-relay, newTag: unbuilt }
# Two nodes (kind-config.yaml, ADR-0032). Infra StatefulSets keep their data
# on a node-local volume, and a single-replica service can't move without
# an outage, so both stay on the control-plane: the worker carries only
# replicated pods, and draining it interrupts nothing.
patches:
  - target: { kind: StatefulSet }
    patch: &on-control-plane |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { node-role.kubernetes.io/control-plane: "" }
  - target: { kind: Deployment, name: "^(registry|memory-store|review-console|outbox-relay|otel-collector)$" }
    patch: *on-control-plane
