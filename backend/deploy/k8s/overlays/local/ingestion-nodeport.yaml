# ingestion from the host, through kube-proxy to whichever pods are ready
# (kind-config.yaml maps host 127.0.0.1:18101 to node port 30001). A
# `kubectl port-forward` is pinned to one pod and breaks when that pod is
# replaced, so load during a rollout (Day 19) goes through this instead.
apiVersion: v1
kind: Service
metadata:
  name: ingestion-nodeport
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: ingestion }
  ports:
    - { name: http, port: 8000, targetPort: 8000, nodePort: 30001 }
