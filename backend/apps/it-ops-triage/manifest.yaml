# App Manifest for it-ops-triage (docs/ARCHITECTURE.md §3, ADR-0006).
#
# Source of truth; registry holds the runtime copy. After editing, register
# it (code first, manifest second, §12):
#
#   uv run backend/scripts/register_app.py it-ops-triage

app_id: it-ops-triage
display_name: IT-ops alert triage

agents:
  - agent_id: triage-agent
    version: 0.1.0
    role: entry
    prompt_ref: prompts/triage-agent.md
    tool_allowlist:
      - lookup_runbook

  # Callable (Day 8, ADR-0012): runs after the final decision is ESCALATE,
  # adds a probable root cause to reasons[]; never changes the decision.
  - agent_id: root-cause-summarizer
    version: 0.1.0
    role: callable
    invoke_on: [ESCALATE]
    prompt_ref: prompts/root-cause-summarizer.md
    tool_allowlist:
      - lookup_runbook
      - recent-changes-lookup

event_schema_ref: event_schema.json
# Joined with ":" into alert_key, e.g. "disk_full:web-01" (ADR-0007).
alert_key_fields: [alert_type, host]

tools:
  - tool_id: lookup_runbook
    version: 1.0.0
    scope: app
  - tool_id: recent-changes-lookup
    version: 1.0.0
    scope: app

# Prefix of every memory-store key for this app (§3, §6).
memory_namespace: it-ops-triage

# Deterministic guardrails (ADR-0010, ADR-0021): any match forces ESCALATE,
# whatever the agent decided. Rules read "alert.<envelope field>",
# "payload.<path>" or "context.<GetContextResponse field>".
escalate_when:
  - field: alert.severity
    in: [critical]

# Supervisor (ADR-0020): below this confidence, the decision becomes
# ESCALATE. Omit to use orchestrator's default (0.6).
supervisor:
  min_confidence: 0.6
