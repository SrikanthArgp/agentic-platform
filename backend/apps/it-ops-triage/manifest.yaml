# App Manifest for it-ops-triage (docs/ARCHITECTURE.md §3, ADR-0006).
#
# Source of truth; registry holds the runtime copy. After editing, register
# it (code first, manifest second, §12):
#
#   uv run backend/scripts/register_app.py it-ops-triage

app_id: it-ops-triage
display_name: IT-ops alert triage

agents:
  - agent_id: triage-agent
    version: 0.1.0
    role: entry
    prompt_ref: prompts/triage-agent.md
    tool_allowlist:
      - lookup_runbook

event_schema_ref: event_schema.json
# Joined with ":" into alert_key, e.g. "disk_full:web-01" (ADR-0007).
alert_key_fields: [alert_type, host]

tools:
  - tool_id: lookup_runbook
    version: 1.0.0
    scope: app

# Prefix of every memory-store key for this app (§3, §6).
memory_namespace: it-ops-triage

# Deterministic guardrails (ADR-0010), applied from Day 7. Rules are
# "payload.<path>" or "context.<GetContextResponse field>"; the envelope's
# severity isn't addressable, so it-ops' rules are chosen with Day 7.
escalate_when: []
