[project]
name = "ap-registry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "ap-shared",
]

[tool.uv.sources]
ap-shared = { path = "../../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
