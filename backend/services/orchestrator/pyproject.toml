[project]
name = "ap-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "grpcio>=1.66",
    "aiokafka>=0.12",
    "ap-shared",
    "openai>=3.24,<4",
    "mcp>=2.2,<3",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain>=1.4.3",
]

[tool.uv.sources]
ap-shared = { path = "../../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
markers = ["integration: needs the Compose stack running (backend/local); run with `uv run pytest -m integration`"]
addopts = "-m 'not integration'"
