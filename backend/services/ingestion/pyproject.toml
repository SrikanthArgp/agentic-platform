[project]
name = "ap-ingestion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "aiokafka>=0.12",
    "ap-shared",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[tool.uv.sources]
ap-shared = { path = "../../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "anyio>=4",
]

[tool.pytest.ini_options]
markers = ["integration: needs the Compose stack running (backend/local); run with `uv run pytest -m integration`"]
addopts = "-m 'not integration'"
