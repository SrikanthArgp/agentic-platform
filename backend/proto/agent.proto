syntax = "proto3";

package agent;

import "google/protobuf/struct.proto";

// Synchronous agent-decision entrypoint, mirrored by the alert.received ->
// alert.decided Kafka path. See docs/ARCHITECTURE.md §3/§4/§5.
service Agent {
  rpc RunAgent(RunAgentRequest) returns (RunAgentResponse);
}

message RunAgentRequest {
  // Resolves the App Manifest in registry (agent, tool_allowlist, prompt,
  // memory_namespace) that this run is scoped to. See ARCHITECTURE.md §3.
  string app_id = 1;
  // Which agent in the app's manifest handles this run. Empty resolves to
  // the app's entry agent (the one alert.received triggers). Set explicitly
  // only by orchestrator when it runs a callable agent whose manifest
  // `invoke_on` matches the entry agent's final decision, e.g.
  // root-cause-summarizer on ESCALATE. See ARCHITECTURE.md §3/§5.
  string agent_id = 2;
  string alert_id = 3;
  // Stable identity of "the same alert" for memory/recurrence purposes,
  // built by ingestion from the payload fields listed in the app's manifest
  // `alert_key_fields`, joined with ":" — e.g. "service:region" for
  // cost-anomaly-triage, "rule_id:host" for security-alert-triage. Scoped by
  // app_id, so keys may repeat across apps. See ARCHITECTURE.md §3/§6.
  string alert_key = 4;
  string source = 5;
  string severity = 6;
  string message = 7;
  int64 timestamp_unix_ms = 8;
  // The full app-specific event, exactly as validated by ingestion against
  // the app's event_schema_ref (e.g. baseline_cost/observed_cost for
  // cost-anomaly-triage, indicators[] for security-alert-triage). The
  // fields above are the platform-generic envelope; anything app-specific
  // is read from here. Note Struct stores numbers as doubles. See
  // ARCHITECTURE.md §5.
  google.protobuf.Struct payload = 9;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  AUTO_RESOLVE = 1;
  ESCALATE = 2;
  SUPPRESS = 3;
}

// One tool call the agent made while reasoning about this alert, via
// tool-gateway. Kept as a summary, not a full transcript — the full
// transcript lives in the trace (see docs/ARCHITECTURE.md §7).
message ToolCall {
  string tool_name = 1;
  string result_summary = 2;
}

message RunAgentResponse {
  string app_id = 1;
  // Echoes which agent produced this response: the entry agent's ID on the
  // top-level response published to alert.decided, or a callable-only
  // agent's ID when this is the reply to a delegated call. A callable-only
  // agent leaves `decision` DECISION_UNSPECIFIED — it explains, it doesn't
  // classify. See ARCHITECTURE.md §5.
  string agent_id = 2;
  string alert_id = 3;
  Decision decision = 4;
  // Explainability: every signal that drove the decision, not just the
  // decision itself — mirrors Sentinel's reasons[] contract.
  repeated string reasons = 5;
  repeated ToolCall tool_calls = 6;
  // Echoed from RunAgentRequest.alert_key, so consumers of alert.decided
  // (memory-store's decision counts, review-console's cases) don't parse it
  // out of the Kafka key. See docs/adr/0016.
  string alert_key = 7;
  // The supervisor's confidence in `decision`, 0–1: the agent's own
  // estimate, capped by fixed rules (novel alert, no memory context, ...).
  // Below the app's threshold the decision was forced to ESCALATE. 0 when
  // the run produced no answer of its own. See docs/adr/0020.
  float confidence = 8;
}
